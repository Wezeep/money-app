version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: wezeep
      POSTGRES_USER: wezeep
      POSTGRES_PASSWORD: wezeep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/wezeep
      DATABASE_USERNAME: wezeep
      DATABASE_PASSWORD: wezeep
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-256-bit-secret-key-change-in-production-minimum-32-characters
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
