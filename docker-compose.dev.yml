version: "3.8"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: wezeep
      POSTGRES_USER: wezeep
      POSTGRES_PASSWORD: wezeep
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wezeep"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Override these via an env file (recommended) or edit before running
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wezeep
      SPRING_DATASOURCE_USERNAME: wezeep
      SPRING_DATASOURCE_PASSWORD: wezeep
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: replace-with-a-long-random-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db-data:
    name: money-app-db-data
